<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080910" />
    <title>Orbit Phone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas class="starfield" aria-hidden="true"></canvas>
    <main class="stage">
      <section class="phone" aria-label="Interactive phone mockup">
        <div class="screen" id="screen">
          <div class="wallpaper" aria-hidden="true"></div>
          <button class="dynamic-island" id="dynamicIsland" type="button" aria-label="Open device status" aria-expanded="false" aria-controls="islandDetails">
            <span class="island-camera" aria-hidden="true"></span>
            <span class="island-sensor" aria-hidden="true"></span>
            <span class="island-details" id="islandDetails" aria-hidden="true">
              <span class="island-mark" aria-hidden="true">RI</span>
              <span class="island-details-copy"><strong>RIIZE 01</strong><small id="islandLocation">Seoul · 5G</small></span>
              <span class="island-battery">23%</span>
            </span>
          </button>
          <div class="status-bar">
            <span class="carrier-name">RIIZE 01</span>
            <div class="status-right" aria-label="Network and battery status">
              <svg class="signal-bars" viewBox="0 0 24 20" aria-hidden="true"><path d="M1 15h4v4H1zm6-4h4v8H7zm6-4h4v12h-4zm6-5h4v17h-4z"/></svg>
              <span class="network-label">5G</span>
              <span class="top-battery" aria-label="Battery 23 percent"><span>23%</span><svg viewBox="0 0 30 16" aria-hidden="true"><rect x="1" y="1" width="25" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="27" y="5" width="2" height="6" rx="1"/><rect x="3" y="3" width="5" height="10" rx="2" fill="currentColor"/></svg></span>
            </div>
          </div>

          <section class="lock-screen view active" id="lockView" aria-label="Lock screen">
            <div class="lock-heading">
              <p class="lock-date" id="lockDate">Saturday, October 17</p>
              <h1 class="lock-time" id="lockTime">9:41</h1>
              <div class="lock-widgets">
                <button class="weather-lock" id="lockWeather" type="button" aria-label="Seoul weather">
                  <span class="weather-current"><span class="weather-icon" id="lockWeatherIcon" aria-hidden="true">☀</span><strong id="lockWeatherTemp">--°</strong></span>
                  <span id="lockWeatherCondition">Loading weather</span>
                  <span id="lockWeatherRange">H:--°  L:--°</span>
                </button>
                <button class="spotify-shortcut" id="spotifyShortcut" type="button" aria-label="Open Spotify after unlocking">
                  <svg viewBox="0 0 64 64" aria-hidden="true"><defs><mask id="spotifyMarkCutouts"><circle cx="32" cy="32" r="32" fill="white"/><path d="M15 23c11-3.2 23-2.1 33.5 4.1M17.5 32c9.2-2.6 19.8-1.7 28.5 3.5M20 40c7.4-2 15.6-1.3 22.4 2.7" fill="none" stroke="black" stroke-width="5.2" stroke-linecap="round"/></mask></defs><circle cx="32" cy="32" r="32" fill="white" mask="url(#spotifyMarkCutouts)"/></svg>
                </button>
                <div class="phone-battery" role="img" aria-label="Phone battery 23 percent">
                  <svg class="battery-ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="battery-ring-track" cx="32" cy="32" r="27"/><circle class="battery-ring-progress" cx="32" cy="32" r="27"/><g transform="translate(0 -1.5)"><rect x="25" y="19" width="14" height="25" rx="3" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M29 23h6M29 40h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="32" y="55" text-anchor="middle">23%</text></g></svg>
                </div>
              </div>
              <button class="language-toggle" id="languageToggle" type="button" aria-label="Choose language" aria-haspopup="true" aria-expanded="false">
                <span aria-hidden="true">◎</span> <span id="languageLabel">English</span>
              </button>
              <div class="language-menu" id="languageMenu" role="menu" aria-label="Choose language" hidden>
                <button type="button" role="menuitemradio" data-language="zh-Hant" aria-checked="false">繁體中文</button>
                <button type="button" role="menuitemradio" data-language="ko" aria-checked="false">한국어</button>
                <button type="button" role="menuitemradio" data-language="en" aria-checked="true">English</button>
              </div>
            </div>
            <button class="notification" id="notification" type="button">
              <span class="notification-icon" id="notificationIcon" aria-hidden="true"></span>
              <span class="notification-copy"><strong id="notificationTitle">Event reminder</strong><span id="notificationMessage">Birthday dinner · Tomorrow at 7:00 PM</span></span>
              <span class="notification-now" id="notificationNow">now</span>
            </button>
            <div class="lock-bottom">
              <button class="round-control" id="flashlightButton" type="button" aria-label="Toggle flashlight" aria-pressed="false"><svg viewBox="0 0 32 40" aria-hidden="true"><path d="M8 2h16v5l-3 4v23a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4V11L8 7z" fill="currentColor"/><path d="M10 8h12M16 20v9" stroke="#233020" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="16" r="2" fill="#233020"/></svg></button>
              <button class="open-prompt" id="openPrompt" type="button"><span class="chevron" aria-hidden="true">⌃</span><span id="swipeLabel">Swipe up to open</span></button>
              <button class="round-control" id="cameraButton" type="button" aria-label="Open camera"><svg viewBox="0 0 40 32" aria-hidden="true"><path d="M3 9a3 3 0 0 1 3-3h7l2.5-3h9L27 6h7a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" fill="currentColor"/><circle cx="20" cy="18" r="7" fill="#31411f"/><circle cx="20" cy="18" r="4.5" fill="currentColor"/></svg></button>
            </div>
          </section>

          <section class="passcode-screen view" id="passcodeView" aria-label="Enter passcode" aria-hidden="true">
            <div class="passcode-content">
              <p class="passcode-title" id="passcodeTitle">Enter Passcode</p>
              <div class="passcode-dots" id="passcodeDots" aria-label="Four digit passcode">
                <span></span><span></span><span></span><span></span>
              </div>
              <div class="keypad" id="keypad" aria-label="Passcode keypad">
                <button type="button" data-digit="1"><b>1</b></button>
                <button type="button" data-digit="2"><b>2</b><small>ABC</small></button>
                <button type="button" data-digit="3"><b>3</b><small>DEF</small></button>
                <button type="button" data-digit="4"><b>4</b><small>GHI</small></button>
                <button type="button" data-digit="5"><b>5</b><small>JKL</small></button>
                <button type="button" data-digit="6"><b>6</b><small>MNO</small></button>
                <button type="button" data-digit="7"><b>7</b><small>PQRS</small></button>
                <button type="button" data-digit="8"><b>8</b><small>TUV</small></button>
                <button type="button" data-digit="9"><b>9</b><small>WXYZ</small></button>
                <span class="keypad-spacer" aria-hidden="true"></span>
                <button type="button" data-digit="0"><b>0</b></button>
                <button class="delete-key" id="deleteKey" type="button" aria-label="Delete last digit">⌫</button>
              </div>
              <div class="passcode-footer"><button id="emergencyButton" type="button">Emergency</button><button id="cancelUnlock" type="button">Cancel</button></div>
            </div>
          </section>

          <section class="home-screen view" id="homeView" aria-label="Home screen" aria-hidden="true">
            <div class="widgets">
              <button class="widget calendar-widget" data-app="Calendar" type="button">
                <span class="widget-day" id="widgetDay">Saturday</span><strong class="widget-date" id="widgetDate">17</strong>
                <span class="widget-event"><b id="eventOne">Groceries</b><small id="allDayOne">All-day</small></span><span class="widget-event"><b id="eventTwo">Laundry</b><small id="allDayTwo">All-day</small></span>
              </button>
              <button class="widget weather-widget" data-app="Weather" type="button">
                <span class="weather-place">Seoul <span>↗</span></span><span class="weather-sun" aria-hidden="true">☀</span>
                <strong id="weatherTemperature">18°</strong><span class="weather-summary" id="weatherSummary">Mostly Sunny</span><small id="weatherRange">H:21° &nbsp; L:12°</small>
              </button>
            </div>
            <div class="app-grid" id="appGrid"></div>
            <div class="home-page-dots" aria-label="Page 1 of 1"><span class="selected"></span></div>
            <button class="search-pill" id="searchButton" type="button"><span aria-hidden="true">⌕</span> <span id="searchLabel">Search</span></button>
            <nav class="dock" id="dock" aria-label="Dock"></nav>
          </section>

          <section class="app-panel" id="appPanel" aria-hidden="true">
            <header class="panel-header"><button id="closeApp" type="button" aria-label="Close app">‹</button><strong id="panelTitle">App</strong><span></span></header>
            <div class="panel-content" id="panelContent"></div>
          </section>

          <button class="home-indicator" id="homeIndicator" type="button" aria-label="Go to home screen"><span></span></button>
        </div>
      </section>
      <p class="stage-caption"><span id="stageCaption">A little world in your pocket</span> <span>✦</span></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
